<div class="flex flex-col sm:flex-row items-center justify-between gap-3 px-3 py-3 border-t border-gray-100 bg-gray-50/50 text-xs text-gray-600 select-none">
  <!-- Info Items & Sélecteur taille par page -->
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-1.5">
      <span>Afficher</span>
      <select 
        [ngModel]="pageSize" 
        (ngModelChange)="onPageSizeChange($event)"
        class="h-7 px-2 text-xs font-semibold bg-white rounded border border-gray-200 focus:outline-none focus:ring-1 focus:ring-green-600 cursor-pointer">
        <option *ngFor="let opt of pageSizeOptions" [value]="opt">{{ opt }}</option>
      </select>
      <span>lignes</span>
    </div>
    
    <span class="text-gray-300">|</span>
    
    <div>
      Affichage de <strong class="text-gray-900 font-mono">{{ startItem }}</strong> à <strong class="text-gray-900 font-mono">{{ endItem }}</strong> sur <strong class="text-gray-900 font-mono">{{ totalItems }}</strong> éléments
    </div>
  </div>

  <!-- Boutons Pagination -->
  <div class="flex items-center gap-1">
    <!-- Bouton Précédent -->
    <button 
      type="button"
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 1 || totalItems === 0"
      class="inline-flex items-center justify-center size-7 rounded-md border border-gray-200 bg-white text-gray-700 hover:bg-gray-100 disabled:opacity-30 disabled:pointer-events-none cursor-pointer transition-colors"
      title="Page précédente">
      <lucide-icon name="chevron-left" class="size-3.5"></lucide-icon>
    </button>

    <!-- Numéros de pages -->
    @for (p of pagesList; track $index) {
      @if (p === -1 || p === -2) {
        <span class="px-1.5 text-gray-400 font-mono">...</span>
      } @else {
        <button 
          type="button"
          (click)="goToPage(p)"
          [class.bg-green-700]="p === currentPage"
          [class.text-white]="p === currentPage"
          [class.font-bold]="p === currentPage"
          [class.border-green-700]="p === currentPage"
          [class.bg-white]="p !== currentPage"
          [class.text-gray-700]="p !== currentPage"
          [class.border-gray-200]="p !== currentPage"
          [class.hover:bg-gray-100]="p !== currentPage"
          class="inline-flex items-center justify-center min-w-[28px] h-7 px-1.5 rounded-md border text-xs font-mono transition-colors cursor-pointer shadow-2xs">
          {{ p }}
        </button>
      }
    }

    <!-- Bouton Suivant -->
    <button 
      type="button"
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === totalPages || totalItems === 0"
      class="inline-flex items-center justify-center size-7 rounded-md border border-gray-200 bg-white text-gray-700 hover:bg-gray-100 disabled:opacity-30 disabled:pointer-events-none cursor-pointer transition-colors"
      title="Page suivante">
      <lucide-icon name="chevron-right" class="size-3.5"></lucide-icon>
    </button>
  </div>
</div>
