<header class="sticky top-0 z-40 flex items-center justify-between gap-4 border-b border-gray-200 bg-white/95 px-4 py-2.5 backdrop-blur-md md:px-6 shadow-xs">
  <div class="flex items-center gap-3">
    <button
      class="lg:hidden inline-flex items-center justify-center rounded-lg text-sm font-medium hover:bg-emerald-50 text-gray-700 h-8.5 w-8.5 border border-gray-200 transition-colors"
      aria-label="Ouvrir le menu"
      (click)="onToggleSidebar()"
    >
      <lucide-icon name="menu" class="size-4.5"></lucide-icon>
    </button>
    <div>
      <div class="flex items-center gap-2">
        <h2 class="font-display text-sm font-bold text-gray-900 leading-tight">Espace de Gestion Agro-Industriel</h2>
        <span class="inline-flex items-center gap-1 rounded-md bg-emerald-50 px-1.5 py-0.5 text-[10.5px] font-bold text-emerald-800 border border-emerald-200">
          <span class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          En Ligne
        </span>
      </div>
      <p class="text-[11px] text-gray-500 flex items-center gap-1">
        <span>📍 Vallée du fleuve Sénégal</span>
        <span>•</span>
        <span class="font-medium text-emerald-700">GIE LAWTAN</span>
      </p>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <!-- Notification -->
    <button class="relative inline-flex items-center justify-center rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 h-8.5 w-8.5 border border-gray-200 transition-colors" aria-label="Notifications">
      <lucide-icon name="bell" class="size-4"></lucide-icon>
      <span class="absolute top-1.5 right-1.5 size-1.5 rounded-full bg-amber-500 ring-2 ring-white"></span>
    </button>

    <!-- User Profile Badge & Logout -->
    <div class="flex items-center gap-2 pl-2 border-l border-gray-200">
      <div class="flex items-center gap-2 bg-gray-50 hover:bg-emerald-50/50 p-1 pr-2.5 rounded-lg border border-gray-200 transition-colors">
        <span class="grid size-7 place-items-center rounded-md bg-emerald-700 text-white font-bold text-xs shadow-xs">
          AD
        </span>
        <div class="hidden sm:block text-left">
          <p class="text-xs font-bold text-gray-800 leading-tight">Admin GIE</p>
          <p class="text-[10px] text-emerald-700 font-semibold">Direction Générale</p>
        </div>
      </div>

      <!-- Bouton Déconnexion -->
      <button 
        (click)="logout()" 
        title="Se déconnecter" 
        class="inline-flex items-center gap-1.5 text-xs font-semibold text-rose-600 hover:text-white bg-rose-50 hover:bg-rose-600 px-2.5 py-1.5 rounded-lg border border-rose-200 hover:border-rose-600 transition-all shadow-xs cursor-pointer">
        <lucide-icon name="log-out" class="size-3.5"></lucide-icon>
        <span class="hidden md:inline">Déconnexion</span>
      </button>
    </div>
  </div>
</header>
